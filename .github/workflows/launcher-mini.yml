name: Launcher Plus Mini APK

on:
  push:
    branches: [graphene-launcher-plus]
    paths: [mini-launcher/**, .github/workflows/launcher-mini.yml]
  pull_request:
    branches: [main]
    paths: [mini-launcher/**, .github/workflows/launcher-mini.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SYSTEM_IMAGE: system-images;android-36;google_apis;x86_64
      AVD_NAME: launcher-mini-ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build, install and test Mini
        shell: bash
        run: |
          sudo chgrp "$(id -gn)" /dev/kvm
          sudo chmod g+rw /dev/kvm
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          tools_dir="$sdk_root/cmdline-tools/latest/bin"
          if [[ ! -x "$tools_dir/sdkmanager" ]]; then
            sdkmanager_path=$(find "$sdk_root/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -n 1)
            test -n "$sdkmanager_path"
            tools_dir="$(dirname "$sdkmanager_path")"
          fi
          "$tools_dir/sdkmanager" --sdk_root="$sdk_root" --install emulator platform-tools "$SYSTEM_IMAGE" \
            "platforms;android-36" "build-tools;36.0.0"
          export ANDROID_USER_HOME="$RUNNER_TEMP/launcher-android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          "$tools_dir/avdmanager" create avd --name "$AVD_NAME" --package "$SYSTEM_IMAGE" <<< no
          "$sdk_root/emulator/emulator" -list-avds | grep -Fx "$AVD_NAME"
          export PATH="$sdk_root/platform-tools:$PATH"
          "$sdk_root/emulator/emulator" -avd "$AVD_NAME" -no-window -no-audio -no-boot-anim \
            -no-snapshot -gpu swiftshader > emulator.log 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT

          adb start-server
          for attempt in {1..150}; do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo 'Android emulator exited before completing boot' >&2
              exit 1
            fi
            if [[ "$(timeout 5 adb -e shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]]; then
              adb -e shell getprop ro.build.fingerprint
              bash mini-launcher/build.sh
              "$sdk_root/build-tools/36.0.0/aapt2" dump permissions mini-launcher/build/LauncherPlusMini.apk | tee mini-permissions.txt
              if grep -q 'uses-permission' mini-permissions.txt; then
                echo "Unexpected permission in packaged APK" >&2
                exit 1
              fi
              python3 mini-launcher/smoke.py
              exit 0
            fi
            sleep 2
          done
          echo 'Android failed to complete boot' >&2
          exit 1

      - name: Show emulator diagnostics
        if: failure()
        run: test ! -f emulator.log || tail -n 100 emulator.log
      - name: Upload APK and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LauncherPlusMini
          path: |
            mini-launcher/build/LauncherPlusMini.apk
            mini-*.png
            mini-permissions.txt
            emulator.log
          if-no-files-found: warn
